name: build-system-validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-build-system:
    name: Verify build-system specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate specs
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/validate-specs.ps1
      - name: Verify build-system traceability
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/verify-build-spec.ps1
      - name: Test SDD validators
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/test-validators.ps1
      - name: Check generated ownership manifest
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/generate-build-files.ps1 -Check
