name: spec-validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate-specs:
    name: Validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate spec structure
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/validate-specs.ps1
      - name: Check SDD traceability
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/check-traceability.ps1
      - name: Test SDD validators
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/test-validators.ps1
      - name: Check generated ownership manifest
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/sdd/generate-build-files.ps1 -Check
